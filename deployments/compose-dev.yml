services:
  db:
    image: postgres:17
    container_name: chrono-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ../configs/postgresql.conf:/etc/postgresql.conf
    command: "-c config_file=/etc/postgresql.conf"
    healthcheck:
      test: "sh -c 'pg_isready -U $DB_USER'"
      interval: 1s
      retries: 5

  migrate:
    image: postgres:17-alpine
    container_name: chrono-migrate
    depends_on: 
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ../sql/migrations:/srv/migrations
      - ../scripts/migrate.sh:/srv/migrate.sh
    entrypoint: ["/srv/migrate.sh"]

  api:
    build:
      context: ../
      dockerfile: deployments/Dockerfile
    container_name: chrono-api
    expose:
      - "${APP_PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../:/srv
    command: sh -c "make run -C /srv"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chrono-api.entrypoints=web"
      # - "traefik.http.routers.chrono-api.tls=true"
      # - "traefik.http.routers.chrono-api.tls.certresolver=cloudflare"
      # - "traefik.http.routers.chrono-api.entrypoints=websecure"
      - "traefik.http.routers.chrono-api.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.chrono-api.loadbalancer.server.port=${APP_PORT}"
      - "traefik.http.routers.chrono-api.middlewares=rateLimit@file,latencyCheck@file"

  traefik:
    image: traefik:v3.6
    container_name: traefik
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    command: "--certificatesresolvers.cloudflare.acme.email=${CF_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ../configs/traefik.yml:/etc/traefik/traefik.yaml:ro
      - ../configs/traefik_dynamic.yml:/etc/traefik/traefik_dynamic.yml:ro
      - ../certs:/var/traefik.certs:rw
      - /var/run/docker.sock:/var/run/docker.sock
