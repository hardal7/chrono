mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

  exporters:
    otlp_http/victoriametrics:
      metrics_endpoint: http://vmsingle-vmks-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/opentelemetry/v1/metrics
    # otlp_http/victorialogs:
      # logs_endpoint: http://vlsingle-vmks-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    otlp_http/victoriatraces:
      traces_endpoint: http://vtsingle-vmks-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:10428/insert/opentelemetry/v1/traces

  service:
    pipelines:
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp_http/victoriametrics

      # logs:
        # receivers:
          # - otlp
        # processors:
          # - memory_limiter
          # - batch
        # exporters:
          # - otlp_http/victorialogs

      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp_http/victoriatraces
