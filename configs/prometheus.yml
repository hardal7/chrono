global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "chrono-api"
    static_configs:
      - targets: ["api:80"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "loki"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["loki:3100"]

