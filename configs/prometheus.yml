global:
  scrape_interval: 5s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "chrono-api"
    static_configs:
      - targets: ["chrono-api:9010"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

